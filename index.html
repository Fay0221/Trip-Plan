<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行手帳</title>
<style>
:root{--bg:#e9f1ef;--sf:#fff;--ink:#12303a;--mut:#5b747d;--ac:#1f7a8c;--ac2:#f2b632;--ln:#cfdeda;--bad:#c4452f;--ok:#237a50;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1b20;--sf:#162a31;--ink:#e6f1ef;--mut:#8fa9b0;--ac:#4fb3c6;--ac2:#f2c14e;--ln:#26414a;--bad:#ef7a64;--ok:#5fcf93;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 48px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;min-width:0;padding:9px 10px;border:1.5px solid var(--ln);border-radius:8px;background:var(--sf)}
:focus-visible{outline:3px solid var(--ac2);outline-offset:1px}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--ac);color:#fff;font-weight:700;white-space:nowrap}
button.x{background:none;color:var(--mut);padding:4px 8px;font-weight:400}
.head{background:var(--ink);color:var(--bg);border-radius:14px;padding:16px}
.head input{background:transparent;border:0;border-bottom:1.5px dashed color-mix(in srgb,var(--bg) 45%,transparent);border-radius:0;color:inherit;padding:4px 0}
.head .title{font-size:24px;font-weight:900;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:end}
.row>label{flex:1;font-size:13px;opacity:.85}.row>label.s{flex:0 0 70px}
.tabs{display:flex;gap:6px;margin:14px 0 12px;overflow-x:auto}
.tabs button{flex:1;background:var(--sf);color:var(--mut);border:1.5px solid var(--ln);padding:8px 10px}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--sf);border:1.5px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:17px}
.it{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}
.it b{flex:0 0 52px;color:var(--ac)}.it span{flex:1;overflow-wrap:anywhere;white-space:pre-wrap}
.it input[type=checkbox]{width:20px;height:20px;flex:0 0 auto}
.done{text-decoration:line-through;color:var(--mut)}
.add{display:flex;gap:8px;margin-top:10px}.add input[type=time]{flex:0 0 112px}.add select{flex:0 0 90px}
.mut{color:var(--mut);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{background:var(--bg);border:1.5px solid var(--ln);border-radius:99px;padding:2px 4px 2px 14px;display:flex;align-items:center}
.f{display:grid;gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who{display:flex;flex-wrap:wrap;gap:8px}
.who label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--ln);border-radius:99px;padding:3px 12px}.who input{width:auto}
.err{color:var(--bad);min-height:1.4em;font-size:14px;margin:6px 0}
.ex{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}.ex>div{flex:1;min-width:0}
.big{font-size:28px;font-weight:900}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--mut);font-size:13px}.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.tk{display:flex;background:var(--sf);border:1.5px solid var(--ln);border-radius:12px;margin-bottom:10px;overflow:hidden}
.tk .p{flex:1;padding:12px 14px;font-weight:700}.tk .p small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.tk .a{padding:12px 16px;border-left:2px dashed var(--ln);background:var(--ac2);color:#2a2000;font-weight:900;font-size:19px;display:flex;align-items:center}
.empty{text-align:center;color:var(--mut);padding:24px 8px}

.days{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.dc{flex:0 0 64px;display:flex;flex-direction:column;align-items:center;background:var(--sf);color:var(--ink);border:1.5px solid var(--ln);padding:6px 0;line-height:1.3}
.dc.on{background:var(--ac);color:#fff;border-color:var(--ac)}.dc small{font-weight:400;font-size:12px}.dc b{font-size:17px}
textarea.note{background:color-mix(in srgb,var(--ac2) 18%,var(--sf));margin:4px 0 10px}
.meals{display:grid;gap:8px;margin:4px 0 10px}.meals label{display:flex;align-items:center;gap:8px}.meals span{flex:0 0 44px;font-size:14px;color:var(--mut)}
.qty{flex:0 0 auto;color:var(--mut);font-size:14px}
input.dayf,#dw{font-size:13px;padding:3px 8px;border-radius:6px;border-color:transparent;background:var(--bg)}
.meals{gap:3px;margin:2px 0 8px}.meals span{font-size:12px;flex:0 0 34px}.sm{font-size:12px;line-height:1.4}
.hd{flex:0 0 auto;cursor:grab;touch-action:none;color:var(--mut);padding:4px 8px 4px 0;user-select:none;-webkit-user-select:none;font-size:18px;line-height:1}
.it.drag{background:color-mix(in srgb,var(--ac2) 25%,var(--sf));box-shadow:0 2px 10px rgba(0,0,0,.25);position:relative;z-index:2}
.qi{flex:0 0 76px;width:76px;padding:4px 8px;font-size:14px}
.it .hd{flex:0 0 auto;padding:4px 2px 4px 0}
.it.sm{padding:3px 0;gap:6px;font-size:14px}.it.sm input[type=checkbox]{width:16px;height:16px}
.it.sm .qi{flex:0 0 58px;width:58px;font-size:13px;padding:3px 6px}
.ci{flex:0 0 58px;width:58px;font-size:12px;padding:3px 2px}
.cat{margin:10px 0 2px;font-weight:700}
.pc{background:var(--sf);color:var(--mut);border:1.5px solid var(--ln);border-radius:99px;padding:2px 12px;font-weight:400;font-size:13px}
.pc.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.owb{flex:0 0 auto;max-width:45%;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:400;background:var(--sf);color:var(--mut);border:1.5px solid var(--ln);border-radius:6px;padding:3px 8px}
.owb.has{color:var(--ink)}
.tk.paid{opacity:.55}.tk.paid .a{text-decoration:line-through}
.px{flex:0 0 auto;width:auto;max-width:55%}
.lkb{flex:0 0 auto;text-decoration:none;font-size:16px;padding:0 4px}
.urlrow{display:none;margin:3px 0 4px 42px}.fw:focus-within .urlrow{display:block}
.fw:focus-within .ingl{display:none}
select.dayf{font-size:13px;padding:3px 6px;border-color:transparent;background:var(--bg)}
.mny{margin-top:6px}
.spr{display:flex;align-items:center;gap:8px;margin:4px 0}.spr label{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.spr input[type=checkbox]{width:18px;height:18px;flex:0 0 auto}.spr input[type=number]{flex:0 0 80px;width:80px;padding:4px 8px}
#sp .rt,#sp .ex2,#sp .h-eq,#sp .h-ratio,#sp .h-exact,#sp #exs{display:none}
#sp[data-m=ratio] .rt,#sp[data-m=ratio] .h-ratio,#sp[data-m=exact] .ex2,#sp[data-m=exact] .h-exact,#sp[data-m=exact] #exs,#sp[data-m=eq] .h-eq{display:block}
</style>
</head>
<body>
<main>
<!-- ⚠️ 第一步：把 Firebase 設定貼在這裡（教學見 README.md） -->
<div id="app" hidden>
  <div class="head" id="hd">
    <input class="title" id="nm" placeholder="旅程名稱" aria-label="旅程名稱">
    <div class="row">
      <label>出發日<input type="date" id="st"></label>
      <label>回程日<input type="date" id="en"></label>
      <label class="s">幣別<input id="cu" maxlength="6"></label>
    </div>
    <div class="row" style="margin-top:10px"><button id="cv" class="ghost">封面圖片</button><button id="cx" class="ghost" hidden>移除</button><input type="file" id="cf" accept="image/*" hidden></div>
    <div class="row" style="margin-top:10px"><button id="inv" style="background:var(--ac2);color:#2a2000">複製邀請連結</button><button id="sw" style="background:transparent;border:1.5px solid currentColor;color:inherit">換旅程</button><span class="mut" id="sync" style="color:inherit;opacity:.8">連線中…</span></div>
  </div>
  <div id="ppl"></div>

</div>
<div id="gate" class="card" hidden>
  <h3>加入或建立旅程</h3>
  <p class="mut">輸入朋友給你的旅程代碼就能加入；也可以自己取一個至少 8 個字的新代碼（越長越難被猜到）。</p>
  <div class="add"><input id="cd" placeholder="旅程代碼" aria-label="旅程代碼"><button id="go">進入</button></div>
  <p class="err" id="gerr"></p>
</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== 在這裡貼上你的 Firebase 設定 ===== */
const CFG={apiKey:"AIzaSyDyUk-VMrg0YbBEgc_cueQSku8R1vZ5o_c",authDomain:"trip-plan-9cbe5.firebaseapp.com",projectId:"trip-plan-9cbe5",storageBucket:"trip-plan-9cbe5.firebasestorage.app",messagingSenderId:"42515293827",appId:"1:42515293827:web:a7f6fafa908f7c13081db6"};
/* ======================================= */

const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const URLRE=/((?:https?:\/\/|www\.)[A-Za-z0-9\-._~:\/?#@!$&'*+,;=%\[\]()]+)/;
const hrefOf=u=>/^www\./.test(u)?'https://'+u:u;
const urlOf=t=>{const m=String(t||'').match(URLRE);return m?hrefOf(m[1]):''};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const normUrl=v=>{v=(v||'').trim();if(!v)return'';if(/^https?:\/\//i.test(v))return v;if(/^[a-z][a-z0-9+.\-]*:/i.test(v))return'';return 'https://'+v};
const lkb=u0=>{const u=safeUrl(u0);return u?`<a class="lkb" href="${esc(u)}" target="_blank" rel="noopener noreferrer" aria-label="開啟連結">🔗</a>`:''};
const lk=t=>String(t).split(new RegExp(URLRE.source)).map((p,i)=>{if(i%2){const h=hrefOf(p);let d=p;try{d=new URL(h).hostname.replace(/^www\./,'')}catch(e){}return `<a href="${esc(h)}" target="_blank" rel="noopener noreferrer">🔗${esc(d)}</a>`}return esc(p)}).join('');
const uid=()=>Math.random().toString(36).slice(2,9);
const W='日一二三四五六';
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const fk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let splitMode='eq',pplOpen=false,gearOpen='',wishSel=[],editWish='',wishOpen='',editItem='',ownOpen='',editExp='',gearTab='shared',me='',dragging=false,code='',db=null,tab='trip',pend=false,selDay='',foodTab='eat';
let M={name:'我們的旅程',start:'',end:'',cur:'NT$'};
const D={settled:[],pitem:[],notes:[],items:[],gear:[],food:[],exp:[],memo:[],people:[]};
try{code=decodeURIComponent(location.hash.slice(1))||localStorage.getItem('tripcode')||''}catch(e){}

const C=n=>db.collection('trips').doc(code).collection(n);
const sErr=e=>{$('#sync').textContent='⚠️ 儲存失敗：'+((e&&e.code)||'請檢查網路')};
const wr=p=>{const y=$('#sync');y.textContent='儲存中…';const t=setTimeout(()=>{y.textContent='⚠️ 超過 8 秒沒寫進雲端，請檢查網路、廣告阻擋或 Firebase 規則'},8000);return p.then(()=>{clearTimeout(t);y.textContent='✓ 已儲存到雲端'}).catch(e=>{clearTimeout(t);sErr(e)})};
const put=(n,id,d)=>wr(C(n).doc(id).set(d));
const upd=(n,id,d)=>wr(C(n).doc(id).update(d));
const del=(n,id)=>wr(C(n).doc(id).delete());
const putm=(n,id,d)=>wr(C(n).doc(id).set(d,{merge:true}));

function dayList(){if(!M.start)return[];const e=M.end&&M.end>=M.start?M.end:M.start;const o=[];let d=pd(M.start);const l=pd(e);while(d<=l&&o.length<31){o.push(fk(d));d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)}return o}
const dl=(k,i)=>{const d=pd(k);return `Day ${i+1}　${d.getMonth()+1}/${d.getDate()}（${W[d.getDay()]}）`};
const money=c=>M.cur+' '+(c/100).toLocaleString('zh-TW',{maximumFractionDigits:2,minimumFractionDigits:c%100?2:0});
const nm=id=>{const p=D.people.find(p=>p.id===id);return p?esc(p.name):'?'};
const byO=a=>a.slice().sort((x,y)=>(x.o!=null?x.o:x.t||0)-(y.o!=null?y.o:y.t||0));
const byT=a=>a.slice().sort((x,y)=>(x.t||0)-(y.t||0));

function splitC(t,ws){
  if(!ws.some(v=>v>0))ws=ws.map(()=>1);
  const tot=ws.reduce((a,b)=>a+b,0),raw=ws.map(w=>t*w/tot),fl=raw.map(Math.floor);
  let r=t-fl.reduce((a,b)=>a+b,0);
  raw.map((v,i)=>[v-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,r).forEach(o=>fl[o[1]]++);
  return fl;
}
function shares(x){
  const t=Math.round(x.amt*100),w=(x.who||[]).filter(i=>D.people.some(p=>p.id===i)),out={};
  if(!w.length)return out;
  const mode=x.mode||'eq';let ws=w.map(()=>1);
  if(mode==='exact'){
    const ex=w.map(i=>Math.round((parseFloat((x.ex||{})[i])||0)*100));
    if(ex.reduce((a,b)=>a+b,0)===t){w.forEach((i,k)=>{out[i]=ex[k]});return out}
    ws=ex;
  }else if(mode==='ratio')ws=w.map(i=>{const v=parseFloat((x.w||{})[i]);if(v>=0)return v;const p=D.people.find(p=>p.id===i);return p&&p.w!=null?p.w:1});
  const c=splitC(t,ws);w.forEach((i,k)=>{out[i]=c[k]});return out;
}
function calc(){
  const paid={},share={};D.people.forEach(p=>{paid[p.id]=0;share[p.id]=0});
  D.exp.forEach(x=>{
    const t=Math.round(x.amt*100);
    if(x.payer in paid)paid[x.payer]+=t;
    const sh=shares(x);Object.keys(sh).forEach(i=>{if(i in share)share[i]+=sh[i]});
  });
  const R=id=>{let c=id;const seen=new Set([id]);while(M.proxy&&M.proxy[c]&&D.people.some(p=>p.id===M.proxy[c])){c=M.proxy[c];if(seen.has(c))return id;seen.add(c)}return c};
  const agg={},members={};
  D.people.forEach(p=>{const r=R(p.id);agg[r]=(agg[r]||0)+paid[p.id]-share[p.id];(members[r]=members[r]||[]).push(p.id)});
  const bal=Object.keys(agg).map(id=>({id,v:agg[id]}));
  const cr=bal.filter(b=>b.v>0).map(b=>({...b})).sort((a,b)=>b.v-a.v);
  const de=bal.filter(b=>b.v<0).map(b=>({id:b.id,v:-b.v})).sort((a,b)=>b.v-a.v);
  const tr=[];let i=0,j=0;
  while(i<cr.length&&j<de.length){const m=Math.min(cr[i].v,de[j].v);tr.push({from:de[j].id,to:cr[i].id,v:m});cr[i].v-=m;de[j].v-=m;if(!cr[i].v)i++;if(!de[j].v)j++}
  return{paid,share,tr,members};
}

const HD='<span class="hd" title="按住拖曳排序">⠿</span>';
const row=(n,x)=>`<div class="it" data-i="${x.id}">${n==='food'?HD:''}<input type="checkbox" data-act="tg" data-n="${n}" data-i="${x.id}" ${x.done?'checked':''} aria-label="完成"><span class="${x.done?'done':''}">${esc(x.text)}</span><button class="x" data-act="dl" data-n="${n}" data-i="${x.id}" aria-label="刪除">✕</button></div>`;
const addRow=(id,ph,act,extra='')=>`<div class="add">${extra}<input id="${id}" placeholder="${ph}" aria-label="${ph}"><button data-act="${act}">加入</button></div>`;

const wrow=x=>{if(editWish===x.id)return `<div class="it" data-i="${x.id}" style="flex-wrap:wrap"><input id="wq_t" value="${esc(x.text)}" aria-label="名稱" style="flex:1 1 140px"><button data-act="ws" data-i="${x.id}">儲存</button><button class="x" data-act="wc" style="border:1.5px solid var(--ln)">取消</button></div>`;
  const ow=(Array.isArray(x.ppl)?x.ppl:[]).filter(id=>D.people.some(p=>p.id===id));
  return `<div class="it" data-i="${x.id}" style="flex-wrap:wrap">${HD}<input type="checkbox" data-act="tg" data-n="food" data-i="${x.id}" ${x.done?'checked':''} aria-label="完成"><span class="${x.done?'done':''}">${esc(x.text)}</span><button class="owb ${ow.length?'has':''}" data-act="wp" data-i="${x.id}" aria-label="選擇人員">${ow.length?ow.map(id=>nm(id)).join('、'):'＋人員'}</button><button class="x" data-act="we" data-i="${x.id}" aria-label="編輯名稱">✎</button><button class="x" data-act="dl" data-n="food" data-i="${x.id}" aria-label="刪除">✕</button>`+(wishOpen===x.id?(D.people.length?`<div class="chips" style="flex:0 0 100%;margin:2px 0 4px 28px">${byT(D.people).map(p=>`<button class="pc ${ow.includes(p.id)?'on':''}" data-act="wt" data-i="${x.id}" data-p="${p.id}">${esc(p.name)}</button>`).join('')}</div>`:'<div class="mut sm" style="flex:0 0 100%">請先在上方「參加人員」加入</div>'):'')+'</div>';
};
const MEAL={b:'早餐',l:'午餐',s:'點心',d:'晚餐',n:'宵夜'};
const moneyPanel=(k,nd)=>{const who=Array.isArray(nd[k+'_who'])?nd[k+'_who']:[],P=byT(D.people);
  return `<div class="mny"><div class="add" style="margin:4px 0;flex-wrap:wrap"><input class="dayf" id="amt_${k}" type="number" inputmode="decimal" min="0" step="any" value="${esc(nd[k+'_amt']||'')}" placeholder="金額" aria-label="金額" style="flex:0 0 90px"><select class="dayf" id="pay_${k}" aria-label="誰先付" style="flex:1 1 100px"><option value="">誰先付？</option>${P.map(p=>`<option value="${p.id}" ${nd[k+'_pay']===p.id?'selected':''}>${esc(p.name)} 先付</option>`).join('')}</select><select class="dayf" id="mode_${k}" aria-label="分攤方式" style="flex:0 0 auto;width:auto"><option value="ratio" ${(nd[k+'_mode']||'ratio')==='ratio'?'selected':''}>依比例</option><option value="eq" ${nd[k+'_mode']==='eq'?'selected':''}>平均</option></select></div><div class="mt chips" style="margin:0"><button class="pc" data-act="sa" data-k="${k}">全員分攤</button>${P.map(p=>`<button class="pc sw ${who.includes(p.id)?'on':''}" data-act="sw" data-k="${k}" data-p="${p.id}">${esc(p.name)}</button>`).join('')}</div><div class="mut sm" style="margin-top:4px">金額、付款人、分攤的人都選好，才會記入「記帳」</div></div>`};
const mealSum=(k,nd,ml=42)=>{const amt=parseFloat(nd[k+'_amt']);if(!(amt>0))return'';
  const who=(Array.isArray(nd[k+'_who'])?nd[k+'_who']:[]).filter(id=>D.people.some(p=>p.id===id)),pay=nd[k+'_pay'],okp=D.people.some(p=>p.id===pay);
  return `<div class="ingl mut sm" style="margin:0 0 4px ${ml}px">💰 ${money(Math.round(amt*100))}${okp?'　'+nm(pay)+' 先付':''}${who.length?'　'+who.length+' 人分攤':''}${okp&&who.length?'　✓ 已記入記帳':'　⚠ 還缺付款人或分攤人，尚未記入'}</div>`};
function syncMealExp(notes){
  const want={};
  notes.forEach(n=>['b','l','s','d','n','stay'].forEach(c=>{
    const k=c==='stay'?'stay':'m_'+c,amt=parseFloat(n[k+'_amt']),pay=n[k+'_pay'];
    const who=(Array.isArray(n[k+'_who'])?n[k+'_who']:[]).filter(id=>D.people.some(p=>p.id===id));

    st=`<h3 style="margin:16px 2px 10px">該付給誰　已結清 ${doneN}/${r.tr.length}</h3>`+(r.tr.length?r.tr.map(t=>{const z=stOf(t);return `<div class="tk ${z==='ok'?'paid':''}"><div class="p"><small>付給</small>${grp(t.from)} → ${grp(t.to)}<br><button class="x" data-act="st" data-f="${t.from}" data-t="${t.to}" data-v="${t.v}" style="padding:2px 0;font-size:13px">${z==='ok'?'✓ 已結清（點一下取消）':z==='chg'?'金額有變動，點一下重新標示結清':'標示結清'}</button></div><div class="a">${money(t.v)}</div></div>`}).join(''):'<div class="card empty">大家剛好打平。</div>')+
    `<section class="card"><h3>每人明細</h3><div style="overflow-x:auto"><table><tr><th>姓名</th><th>已付</th><th>應分攤</th><th>差額</th></tr>${rows}</table></div></section>`+proxyCard;
  }
  return form+list+st;
}
function memoV(){
  return `<section class="card"><h3>備忘錄</h3>`+(D.memo.length?byT(D.memo).reverse().map(x=>`<div class="it"><span>${esc(x.text)}</span><button class="x" data-act="dl" data-n="memo" data-i="${x.id}" aria-label="刪除">✕</button></div>`).join(''):'<div class="mut">訂房代號、集合地點、注意事項都可以記在這裡</div>')+
  `<div class="f" style="margin-top:10px"><textarea id="mt" rows="3" placeholder="寫點什麼…" aria-label="備忘內容"></textarea><button data-act="am">新增備忘</button></div></section>`;
}
const fit=el=>{if(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'}};
document.addEventListener('input',e=>{if(e.target.id==='dw')fit(e.target)});
function pplV(){
  const P=byT(D.people),open=pplOpen||!P.length,wt=p=>p.w!=null?p.w:1;
  return `<section class="card" style="margin:12px 0 0;padding:10px 14px"><button class="x" data-act="po" style="width:100%;text-align:left;padding:0;color:var(--ink);font-weight:700">👥 參加人員（${P.length}）<span style="font-weight:400;font-size:13px;color:var(--mut)">　${open?(P.length?'收起 ▴':''):'展開 ▾'}</span></button>`+
  (open?`<div style="margin:8px 0 4px">${P.map(p=>`<div class="it"><span>${esc(p.name)}</span><span class="mut sm" style="flex:0 0 auto">分攤比重</span><input class="wi" data-i="${p.id}" type="number" inputmode="decimal" step="any" min="0" value="${wt(p)}" aria-label="${esc(p.name)}分攤比重" style="flex:0 0 64px;width:64px;padding:4px 8px"><button class="x" data-act="dp" data-i="${p.id}" aria-label="移除">✕</button></div>`).join('')}</div>${addRow('pn','輸入名字','ap')}<p class="mut sm" style="margin:8px 0 0">分攤比重用在「比例分攤」，例如大人 1、小孩 0.5，預設是 1。移除某人會一併刪除他付款的費用和他自己加的私人裝備。</p>`:`<div class="mut sm" style="margin-top:4px">${P.map(p=>esc(p.name)+(wt(p)!==1?'×'+wt(p):'')).join('、')}</div>`)+'</section>';
}
function updExs(){
  const el=$('#exs');if(!el)return;
  const amt=parseFloat($('#ea').value)||0;let sum=0;
  document.querySelectorAll('[name=ew]:checked').forEach(c=>{sum+=parseFloat($('#re_'+c.value).value)||0});
  sum=Math.round(sum*100)/100;const diff=Math.round((amt-sum)*100)/100;
  el.textContent=`已指定 ${sum} ／ 總額 ${amt}，${diff===0?'✓ 剛好':diff>0?'還差 '+diff:'超過 '+(-diff)}`;
}
document.addEventListener('input',e=>{if(e.target.classList.contains('ex2')||e.target.id==='ea'||e.target.name==='ew')updExs()});
function render(){
  $('#ppl').innerHTML=pplV();
  const T=[['trip','行程'],['gear','裝備'],['food','美食'],['exp','記帳'],['memo','備忘']];
  $('#tabs').innerHTML=T.map(([k,v])=>`<button class="${tab===k?'on':''}" data-act="tab" data-t="${k}">${v}</button>`).join('');
  $('#view').innerHTML=({trip:tripV,gear:gearV,food:foodV,exp:expV,memo:memoV})[tab]();
  fit($('#dw'));updExs();
}
function rerender(){
  const a=document.activeElement;
  if(dragging||a&&a.closest&&a.closest('#view,#ppl')&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&!a.dataset.act){pend=true;return}
  pend=false;render();
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pend)rerender()},200));

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||!db)return;
  const a=b.dataset.act,d=b.dataset,v=id=>($('#'+id)||{value:''}).value.trim();
  if(a==='tab'){tab=d.t;render()}
  else if(a==='sd'){selDay=d.d;render()}
  else if(a==='ft'){foodTab=d.k;render()}
  else if(a==='gs'){gearTab=d.k;render()}
  else if(a==='po'){pplOpen=!pplOpen;render()}
  else if(a==='gop'){gearOpen=gearOpen===d.i?'':d.i;render()}
  else if(a==='got'){const x=D.gear.find(f=>f.id===d.i);if(!x)return;const cur=Array.isArray(x.ppl)?x.ppl:[];upd('gear',x.id,{ppl:cur.includes(d.p)?cur.filter(i=>i!==d.p):[...cur,d.p]})}
  else if(a==='sw'){b.classList.toggle('on');const bx=b.closest('.mt');saveNote({[d.k+'_who']:[...bx.querySelectorAll('.sw.on')].map(x=>x.dataset.p)})}
  else if(a==='sa'){const bx=b.closest('.mt');bx.querySelectorAll('.sw').forEach(x=>x.classList.add('on'));saveNote({[d.k+'_who']:[...bx.querySelectorAll('.sw')].map(x=>x.dataset.p)})}
  else if(a==='wn'){wishSel=wishSel.includes(d.p)?wishSel.filter(i=>i!==d.p):[...wishSel,d.p];b.classList.toggle('on')}
  else if(a==='we'){editWish=d.i;render()}
  else if(a==='wc'){editWish='';render()}
  else if(a==='ws'){const t=v('wq_t');if(!t)return;upd('food',d.i,{text:t});editWish='';render()}
  else if(a==='wp'){wishOpen=wishOpen===d.i?'':d.i;render()}
  else if(a==='wt'){const x=D.food.find(f=>f.id===d.i);if(!x)return;const cur=Array.isArray(x.ppl)?x.ppl:[];upd('food',x.id,{ppl:cur.includes(d.p)?cur.filter(i=>i!==d.p):[...cur,d.p]})}
  else if(a==='mm'){const c=d.c,m=d.m;saveNote({['m_'+c+'_mode']:m});b.closest('.fw').querySelectorAll('.mt .pc').forEach(x=>x.classList.toggle('on',x.dataset.m===m));$('#u_'+c).hidden=m!=='out';$('#g_'+c).hidden=m!=='cook'}
  else if(a==='ie'){editItem=d.i;render()}
  else if(a==='ic'){editItem='';render()}
  else if(a==='is'){const x=v('ei_x');if(!x)return;putm('items',d.i,{time:$('#ei_t').value,text:x,url:normUrl(v('ei_u'))});editItem='';render()}
  else if(a==='st'){const id=d.f+'_'+d.t,sd=D.settled.find(x=>x.id===id);if(sd&&String(sd.v)===d.v)del('settled',id);else put('settled',id,{v:Number(d.v)})}
  else if(a==='ee'){editExp=d.i;splitMode=(D.exp.find(x=>x.id===d.i)||{}).mode||'eq';render();const f=$('#et');if(f)f.scrollIntoView({block:'center'})}
  else if(a==='ec'){editExp='';splitMode='eq';render()}
  else if(a==='sm'){splitMode=d.m;b.parentNode.querySelectorAll('.pc').forEach(x=>x.classList.toggle('on',x===b));$('#sp').dataset.m=d.m;updExs()}
  else if(a==='ow'){ownOpen=ownOpen===d.c?'':d.c;render()}
  else if(a==='ot'){const n0=D.notes.find(n=>n.id===selDay)||{},cur=Array.isArray(n0['o_'+d.c])?n0['o_'+d.c]:[];putm('notes',selDay,{['o_'+d.c]:cur.includes(d.i)?cur.filter(x=>x!==d.i):[...cur,d.i]})}
  else if(a==='me'){me=d.i;try{localStorage.setItem('tripme_'+code,me)}catch(x){}render()}
  else if(a==='me0'){me='';try{localStorage.removeItem('tripme_'+code)}catch(x){}render()}
  else if(a==='agp'){const x=v('pg');if(x&&me)put('pitem',uid(),{who:me,text:x,done:{},t:Date.now()})}
  else if(a==='agt'){const x=v('pt');if(x)put('pitem',uid(),{who:'',text:x,done:{},t:Date.now()})}
  else if(a==='tp'){if(me)wr(C('pitem').doc(d.i).set({done:{[me]:b.checked}},{merge:true}))}
  else if(a==='ce'){catEdit=!catEdit;render()}
  else if(a==='ac'){const n=v('cn');if(!n||CT().includes(n))return;saveMeta({cats:[...CT().filter(x=>x!=='其他'),n,'其他']})}
  else if(a==='dc'){saveMeta({cats:CT().filter(x=>x!==d.k)})}
  else if(a==='ai'){const x=v('x_'+d.d);if(x)put('items',uid(),{date:d.d,time:$('#t_'+d.d).value,text:x,url:normUrl(v('w_'+d.d)),t:Date.now()})}
  else if(a==='ag'){const x=v('gt');if(x)put('gear',uid(),{text:x,qty:v('gq'),done:false,t:Date.now()})}
  else if(a==='af_eat'||a==='af_buy'){const k=a.slice(3),x=v('f_'+k);if(x)put('food',uid(),{kind:k,text:x,qty:v('q_'+k),cat:v('c_'+k),ppl:k==='eat'?wishSel.filter(id=>D.people.some(p=>p.id===id)):[],done:false,t:Date.now()});if(x&&k==='eat')wishSel=[]}
  else if(a==='am'){const x=v('mt');if(x)put('memo',uid(),{text:x,t:Date.now()})}
  else if(a==='tg'){upd(d.n,d.i,{done:b.checked})}
  else if(a==='dl'){del(d.n,d.i)}
  else if(a==='ap'){const x=v('pn');if(x)put('people',uid(),{name:x,t:Date.now()})}
  else if(a==='dp'){
    del('people',d.i);
    D.pitem.forEach(x=>{if(x.who===d.i)del('pitem',x.id)});
    D.exp.forEach(x=>{if(x.payer===d.i)del('exp',x.id);else if(x.who.includes(d.i))upd('exp',x.id,{who:x.who.filter(i=>i!==d.i)})});
  }
  else if(a==='ae'){
    const title=v('et'),amt=parseFloat($('#ea').value),who=[...document.querySelectorAll('[name=ew]:checked')].map(c=>c.value),mode=($('#sp')||{dataset:{}}).dataset.m||'eq';
    const w={},ex={};who.forEach(i=>{const a1=parseFloat($('#rw_'+i).value);w[i]=a1>=0?a1:1;ex[i]=parseFloat($('#re_'+i).value)||0});
    const sum=who.reduce((a1,i)=>a1+ex[i],0);
    const m=!title?'請輸入費用名稱':!(amt>0)?'請輸入大於 0 的金額':!who.length?'至少要選一位分攤的人':mode==='ratio'&&!who.some(i=>w[i]>0)?'比例至少要有一位大於 0':mode==='exact'&&Math.abs(sum-amt)>0.005?`指定金額加總 ${Math.round(sum*100)/100} 要等於總金額 ${amt}`:'';
    if(m){$('#err').textContent=m;return}
    const E=D.exp.find(x=>x.id===editExp);
    put('exp',E?E.id:uid(),{title,amt,payer:$('#ep').value,date:$('#ed').value,who,mode,w:mode==='ratio'?w:{},ex:mode==='exact'?ex:{},t:E?E.t:Date.now()});
    editExp='';splitMode='eq';render();
  }
});

const hdr=()=>{[['nm','name'],['st','start'],['en','end'],['cu','cur']].forEach(([i,k])=>{const el=$('#'+i);if(el&&document.activeElement!==el)el.value=M[k]||''});
  const h=$('#hd');h.style.backgroundImage=M.cover?`linear-gradient(rgba(8,22,28,.5),rgba(8,22,28,.8)),url(${M.cover})`:'';h.classList.toggle('cv',!!M.cover);$('#cx').hidden=!M.cover};
const saveMeta=p=>{Object.assign(M,p);hdr();render();wr(db.collection('trips').doc(code).set(p,{merge:true}))};
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.hd');if(!h||!db)return;
  e.preventDefault();
  const row=h.closest('.it'),box=row.parentNode;
  dragging=true;row.classList.add('drag');
  const mv=ev=>{const sib=[...box.querySelectorAll('.it')].filter(r=>r!==row);const nx=sib.find(r=>{const b=r.getBoundingClientRect();return ev.clientY<b.top+b.height/2});box.insertBefore(row,nx||null)};
  const up=()=>{
    ['pointermove','pointerup','pointercancel'].forEach((t,i)=>document.removeEventListener(t,i?up:mv));
    row.classList.remove('drag');dragging=false;
    const b=db.batch();let n=0;
    [...box.querySelectorAll('.it')].forEach((r,i)=>{const x=D.food.find(f=>f.id===r.dataset.i);if(x&&x.o!==i){b.update(C('food').doc(x.id),{o:i});n++}});
    if(n)wr(b.commit());
    if(pend)rerender();
  };
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
});
document.addEventListener('mousedown',e=>{if(e.target.closest('.mt'))e.preventDefault()});
document.addEventListener('change',e=>{
  if(e.target.classList.contains('wi')&&db){const w1=parseFloat(e.target.value);if(w1>=0)upd('people',e.target.dataset.i,{w:w1})}
  if(e.target.id==='c_buy')buyCat=e.target.value;
  if(e.target.classList.contains('px')&&db)saveMeta({proxy:{...(M.proxy||{}),[e.target.dataset.i]:e.target.value}});
  if(e.target.classList.contains('ci')&&db)upd('food',e.target.dataset.i,{cat:e.target.value});
  if(e.target.classList.contains('qi')&&db)upd(e.target.dataset.n||'food',e.target.dataset.i,e.target.dataset.n==='gear'?{qty:e.target.value.trim()}:{qty:e.target.value.trim(),qm:true});if(e.target.classList.contains('dayf')&&db){const o={text:$('#dn').value.trim(),weather:$('#dw').value.trim(),stay:$('#stay').value.trim()};['b','l','s','d','n'].forEach(c=>{o['m_'+c]=$('#m_'+c).value.trim();o['m_'+c+'_url']=normUrl($('#u_'+c).value);o['m_'+c+'_ing']=$('#g_'+c).value.trim();o['m_'+c+'_amt']=$('#amt_m_'+c).value.trim();o['m_'+c+'_pay']=$('#pay_m_'+c).value;o['m_'+c+'_mode']=$('#mode_m_'+c).value});o.stay_url=normUrl($('#u_stay').value);o.stay_amt=$('#amt_stay').value.trim();o.stay_pay=$('#pay_stay').value;o.stay_mode=$('#mode_stay').value;saveNote(o)}});
$('#cv').onclick=()=>$('#cf').click();
$('#cx').onclick=()=>saveMeta({cover:''});
$('#cf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(900,im.width),h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);saveMeta({cover:c.toDataURL('image/jpeg',.75)})};im.src=r.result};r.readAsDataURL(f);e.target.value=''};
$('#nm').onchange=e=>saveMeta({name:e.target.value});
$('#cu').onchange=e=>saveMeta({cur:e.target.value});
$('#st').onchange=e=>{const p={start:e.target.value};if(M.end&&M.end<p.start)p.end=p.start;saveMeta(p)};
$('#en').onchange=e=>saveMeta({end:e.target.value});
$('#sw').onclick=()=>{try{localStorage.removeItem('tripcode')}catch(e){}history.replaceState(null,'',location.pathname+location.search);location.reload()};
$('#inv').onclick=()=>{const u=location.origin+location.pathname+'#'+encodeURIComponent(code);const ok=()=>$('#inv').textContent='已複製連結';try{navigator.clipboard.writeText(u).then(ok,()=>prompt('複製這個連結：',u))}catch(x){prompt('複製這個連結：',u)}};

function start(){
  try{me=localStorage.getItem('tripme_'+code)||''}catch(e){}
  $('#gate').hidden=true;$('#app').hidden=false;
  try{localStorage.setItem('tripcode',code)}catch(e){}
  location.hash=encodeURIComponent(code);
  const tm=setTimeout(()=>$('#sync').textContent='連線較慢，請檢查網路…',10000);
  const ok=()=>{clearTimeout(tm);$('#sync').textContent='已同步'};
  const er=()=>{clearTimeout(tm);$('#sync').textContent='讀取失敗，請檢查 Firebase 設定與規則'};
  db.collection('trips').doc(code).onSnapshot({includeMetadataChanges:true},s=>{if(s.metadata.fromCache)$('#sync').textContent='⚠️ 只讀到本機暫存，尚未連上雲端';else if(!/儲存|⚠️ 超過/.test($('#sync').textContent))ok();if(s.exists)Object.assign(M,s.data());hdr();rerender()},er);
  Object.keys(D).forEach(n=>C(n).onSnapshot(q=>{D[n]=q.docs.map(d=>({...d.data(),id:d.id}));rerender()},er));
  hdr();render();
}
function boot(){
  if(CFG.apiKey==='貼上'){document.body.insertAdjacentHTML('afterbegin','<main><div class="card"><h3>還沒設定 Firebase</h3><p>請打開 index.html，把 CFG 區塊換成你自己的 Firebase 設定，步驟見 README.md。</p></div></main>');return}
  firebase.initializeApp(CFG);db=firebase.firestore();
  if(code.length>=8)return start();
  $('#gate').hidden=false;
  $('#cd').value=Array.from(crypto.getRandomValues(new Uint8Array(10)),n=>'abcdefghjkmnpqrstuvwxyz23456789'[n%31]).join('');
  $('#go').onclick=()=>{const v=$('#cd').value.trim();if(v.length<8){$('#gerr').textContent='代碼至少要 8 個字';return}code=v;start()};
}
boot();
</script>
